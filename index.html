<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>discord.gg/EHZTXduFm2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000; 
            font-family: 'Courier New', Courier, monospace;
            color: #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
            overflow: hidden;
        }

        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .content {
            z-index: 1;
        }

        .info {
            margin-top: 20px;
            font-size: 1.5em;
            color: #ff0000;
            text-shadow: 0px 0px 8px #ff0000, 0px 0px 15px #ff0000, 0px 0px 25px #ff0000;
            letter-spacing: 4.5px;
            white-space: pre-wrap;
        }

        .text {
            margin-top: 20px;
            font-size: 3em;
            color: #ff1d1d;
            text-shadow: 0px 0px 8px #ff1212, 0px 0px 15px #fb1111, 0px 0px 25px #ff1111;
            letter-spacing: 4.5px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="your_video.mp4" type="video/mp4">
    </video>

    <audio id="myAudio" loop>
        <source src="aa.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="content">
        <div class="text">اما توردها موارد الابطال ولا استرح وخل المراجل لاهلها by MESH&MOLTEN&akouz</div>

        <div class="info" id="ip-info">
            <strong>IP: </strong><span id="ip"></span><br>
            <strong>City: </strong><span id="city"></span><br>
            <strong>Region: </strong><span id="region"></span><br>
            <strong>Country: </strong><span id="country"></span><br>
            <strong>Location: </strong><span id="loc"></span><br>
            <strong>Organization: </strong><span id="org"></span><br>
            <strong>Timezone: </strong><span id="timezone"></span>
        </div>

        <div class="text">GG : حياكم بدس بنطش فاضيح مومنت و فروخ وحيد Bypass w7eed&extlk MESH&Molten&Vlad is here? : discord.gg/soon</div>
    </div>

    <script>
        // كود جلب بيانات الآي بي
        fetch('https://ipinfo.io/json')
        .then(response => response.json())
        .then(data => {
            document.getElementById('ip').textContent = data.ip;
            document.getElementById('city').textContent = data.city;
            document.getElementById('region').textContent = data.region;
            document.getElementById('country').textContent = data.country;
            document.getElementById('loc').textContent = data.loc;
            document.getElementById('org').textContent = data.org;
            document.getElementById('timezone').textContent = data.timezone;
        })
        .catch(error => console.error('Error fetching IP info:', error));

        // الحل النهائي للصوت: يشتغل مع أول ضغطة على الصفحة
        window.addEventListener('click', function() {
            var audio = document.getElementById('myAudio');
            audio.play();
        }, { once: true }); // يشتغل مرة واحدة فقط عند أول كلية
    </script>

</body>
</html>
