<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>discord.gg</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* تم إلغاء خلفية الـ GIF ووضع لون أسود احتياطي */
            background: #000; 
            font-family: 'Courier New', Courier, monospace;
            color: #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
            overflow: hidden;
        }

        /* تنسيق فيديو الخلفية */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* حاوية المحتوى لضمان ظهوره فوق الفيديو */
        .content {
            z-index: 1;
        }

        .info {
            margin-top: 20px;
            font-size: 1.5em;
            color: #ff0000;
            text-shadow: 0px 0px 8px #ff0000, 0px 0px 15px #ff0000, 0px 0px 25px #ff0000;
            letter-spacing: 4.5px;
            white-space: pre-wrap;
        }

        .text {
            margin-top: 20px;
            font-size: 3em;
            color: #ff1d1d;
            text-shadow: 0px 0px 8px #ff1212, 0px 0px 15px #fb1111, 0px 0px 25px #ff1111;
            letter-spacing: 4.5px;
        }
    </style>
</head>
<body>

<img src="https://image2url.com/r2/default/gifs/1775029792172-49301b75-aaed-494d-99b9-67144656a6c9.gif" id="bg-video" alt="background">

<audio id="myAudio" autoplay loop>
    <source src="https://image2url.com/r2/default/audio/1775030769295-b4f8a121-be74-456c-9238-7b7f020ce41a.mp3" type="audio/mpeg">
</audio>

    <div class="content">
        <div class="text">unknown here  </div>

        <div class="info" id="ip-info">
            <strong>IP: </strong><span id="ip"></span><br>
            <strong>City: </strong><span id="city"></span><br>
            <strong>Region: </strong><span id="region"></span><br>
            <strong>Country: </strong><span id="country"></span><br>
            <strong>Location: </strong><span id="loc"></span><br>
            <strong>Organization: </strong><span id="org"></span><br>
            <strong>Timezone: </strong><span id="timezone"></span>
        </div>

        <div class="text">GG : unknown here? ا W7EED&EXTLK KILL : discord.gg/EHZTXduFm2</div>
    </div>

    <script>
        fetch('https://ipinfo.io/json')
        .then(response => response.json())
        .then(data => {
            document.getElementById('ip').textContent = data.ip;
            document.getElementById('city').textContent = data.city;
            document.getElementById('region').textContent = data.region;
            document.getElementById('country').textContent = data.country;
            document.getElementById('loc').textContent = data.loc;
            document.getElementById('org').textContent = data.org;
            document.getElementById('timezone').textContent = data.timezone;
        })
        .catch(error => console.error('Error fetching IP info:', error));
    </script>

</body>
</html>
